
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Intelligence Hub</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Tech Intelligence Hub</h1>
        <p>Your personal AI and DevOps news dashboard.</p>
    </header>

    <main>
        <h2>Latest Articles</h2>
        <div id="articles">
            <p>Articles will appear here.</p>
        </div>
    </main>
    
<script>
    async function loadArticles() {
        const container = document.getElementById("articles");

        try {
            const response = await fetch("/articles");

            if (!response.ok) {
                throw new Error("Failed to load articles");
            }

            const articles = await response.json();
            container.replaceChildren();

            articles.forEach(article => {
                const card = document.createElement("article");
                const title = document.createElement("h3");
                const category = document.createElement("p");
                const source = document.createElement("p");

                title.textContent = article.title;
                category.textContent = `Category: ${article.category}`;
                source.textContent = `Source: ${article.source}`;

                card.append(title, category, source);
                container.appendChild(card);
            });
        } catch (error) {
            container.textContent = "Unable to load articles.";
            console.error(error);
        }
    }

    loadArticles();
</script>

</body>
</html>
